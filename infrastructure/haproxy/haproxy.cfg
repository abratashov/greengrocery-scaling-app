global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:3000
    default_backend rails

backend rails
    balance roundrobin

    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    server rails1 rails-1:3000 check inter 60s
    server rails2 rails-2:3000 check inter 60s
