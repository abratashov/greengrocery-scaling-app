global
    log stdout format raw local0

defaults
    mode http
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:80
    http-request redirect scheme https

frontend https
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem
    default_backend rails

backend rails
    balance roundrobin
    option httpchk GET /up

    server rails-1 127.0.0.1:80 check
    server rails-2 10.0.0.20:80 check
